name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct source bundle
        shell: bash
        run: |
          cat bundle/part00.b64 bundle/part01.b64 bundle/part02.b64 bundle/part03.b64 bundle/part04.b64 bundle/part05.b64 bundle/part06.b64 | base64 --decode > health-ci.zip
          unzip -t health-ci.zip
          unzip -q health-ci.zip
          test -f health-offline-android/settings.gradle.kts

      - name: Apply 1.0.1 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('health-offline-android/app/src/main/java/il/co/offlinehealth/MainActivity.kt')
          s = main.read_text()
          s = s.replace('setTextColor(text)', 'setTextColor(this@MainActivity.text)')
          s = s.replace('else text)', 'else this@MainActivity.text)')
          main.write_text(s)

          db = Path('health-offline-android/app/src/main/java/il/co/offlinehealth/HealthDb.kt')
          s = db.read_text()
          bad = "readableDatabase.rawQuery(\"SELECT id,name || ' · ' || CAST(ROUND(grams) AS INT) || ' גרם · ' || CAST(ROUND(kcal) AS INT) || ' קק״ל FROM food_log WHERE day=? ORDER BY created_at DESC\", arrayOf(day)).use { c -> while(c.moveToNext()) out.add(c.getLong(0) to c.getString(1)) }"
          good = "readableDatabase.rawQuery(\"SELECT id,name,grams,kcal FROM food_log WHERE day=? ORDER BY created_at DESC\", arrayOf(day)).use { c -> while(c.moveToNext()) { val id=c.getLong(0); val name=c.getString(1); val grams=c.getDouble(2).toInt(); val kcal=c.getDouble(3).toInt(); out.add(id to \"$name · $grams גרם · $kcal קק״ל\") } }"
          if bad not in s:
              raise SystemExit('Expected broken journal query not found')
          db.write_text(s.replace(bad, good))

          gradle = Path('health-offline-android/app/build.gradle.kts')
          s = gradle.read_text().replace('versionCode = 1', 'versionCode = 2').replace('versionName = \"1.0.0\"', 'versionName = \"1.0.1\"')
          gradle.write_text(s)
          PY

      - name: Run unit tests
        working-directory: health-offline-android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: health-offline-android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineHealth-1.0.1-debug-apk
          path: health-offline-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
