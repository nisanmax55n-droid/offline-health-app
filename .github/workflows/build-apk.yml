name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct base source bundle
        shell: bash
        run: |
          cat bundle/part00.b64 bundle/part01.b64 bundle/part02.b64 bundle/part03.b64 bundle/part04.b64 bundle/part05.b64 bundle/part06.b64 | base64 --decode > health-ci.zip
          unzip -t health-ci.zip
          unzip -q health-ci.zip
          test -f health-offline-android/settings.gradle.kts

      - name: Apply 1.1 redesigned source
        shell: bash
        run: |
          mkdir -p health-offline-android/keystore
          cat patch/MainActivity.part0.b64 patch/MainActivity.part1.b64 patch/MainActivity.part2a.b64 patch/MainActivity.part2b.b64 patch/MainActivity.part2c.b64 patch/MainActivity.part2d.b64 patch/MainActivity.part3.b64 patch/MainActivity.part4.b64 | base64 -d > /tmp/MainActivity.kt.gz
          echo "d2782429e726f801e418311659d146cc26bcda78a7818f1d4abd787c3ee86295  /tmp/MainActivity.kt.gz" | sha256sum -c -
          gzip -t /tmp/MainActivity.kt.gz
          gunzip -c /tmp/MainActivity.kt.gz > health-offline-android/app/src/main/java/il/co/offlinehealth/MainActivity.kt
          base64 -d patch/HealthDb.kt.gz.b64 | gunzip > health-offline-android/app/src/main/java/il/co/offlinehealth/HealthDb.kt
          base64 -d patch/build.gradle.kts.gz.b64 | gunzip > health-offline-android/app/build.gradle.kts
          base64 -d patch/offlinehealth-dev.jks.b64 > health-offline-android/keystore/offlinehealth-dev.jks
          test -s health-offline-android/app/src/main/java/il/co/offlinehealth/MainActivity.kt
          test -s health-offline-android/app/src/main/java/il/co/offlinehealth/HealthDb.kt
          test -s health-offline-android/keystore/offlinehealth-dev.jks

      - name: Run unit tests
        working-directory: health-offline-android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: health-offline-android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s health-offline-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum health-offline-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineHealth-1.1.0-debug-apk
          path: health-offline-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
