name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct source bundle
        shell: bash
        run: |
          cat bundle/part00.b64 bundle/part01.b64 bundle/part02.b64 bundle/part03.b64 bundle/part04.b64 bundle/part05.b64 bundle/part06.b64 | base64 --decode > health-ci.zip
          unzip -t health-ci.zip
          unzip -q health-ci.zip
          test -f health-offline-android/settings.gradle.kts

      - name: Run unit tests
        working-directory: health-offline-android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: health-offline-android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineHealth-1.0.0-debug-apk
          path: health-offline-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
