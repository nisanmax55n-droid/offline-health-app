name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct base source bundle
        shell: bash
        run: |
          cat bundle/part00.b64 bundle/part01.b64 bundle/part02.b64 bundle/part03.b64 bundle/part04.b64 bundle/part05.b64 bundle/part06.b64 | base64 --decode > health-ci.zip
          unzip -t health-ci.zip
          unzip -q health-ci.zip
          test -f health-offline-android/settings.gradle.kts

      - name: Apply 1.2 source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=health-offline-android
          SRC="$ROOT/app/src/main/java/il/co/offlinehealth"
          mkdir -p "$ROOT/keystore" "$ROOT/scripts" "$ROOT/app/src/main/assets"
          cat patch/v12/MainActivity.part0.b64 patch/v12/MainActivity.part1.b64 patch/v12/MainActivity.part2.b64 patch/v12/MainActivity.part3.b64 patch/v12/MainActivity.part4.b64 | base64 -d | gunzip > "$SRC/MainActivity.kt"
          cp patch/v12/HealthDb.kt "$SRC/HealthDb.kt"
          base64 -d patch/v12/PpgActivity.kt.gz.b64 | gunzip > "$SRC/PpgActivity.kt"
          base64 -d patch/v12/HealthCalculations.kt.gz.b64 | gunzip > "$SRC/HealthCalculations.kt"
          base64 -d patch/v12/build.gradle.kts.gz.b64 | gunzip > "$ROOT/app/build.gradle.kts"
          base64 -d patch/v12/build_israel_catalog.py.gz.b64 | gunzip > "$ROOT/scripts/build_israel_catalog.py"
          base64 -d patch/offlinehealth-dev.jks.b64 > "$ROOT/keystore/offlinehealth-dev.jks"
          grep -q 'versionName = "1.2.0"' "$ROOT/app/build.gradle.kts"
          grep -q 'DB_VERSION = 2' "$SRC/HealthDb.kt"
          grep -q 'class HeartProgressView' "$SRC/PpgActivity.kt"
          grep -q 'fun guidance' "$SRC/HealthCalculations.kt"

      - name: Apply targeted Kotlin source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('health-offline-android/app/src/main/java/il/co/offlinehealth/MainActivity.kt')
          s = main.read_text()
          old = 'else->"🥗"}\n        }\n    }\n\n    private fun addFoodDialog'
          new = 'else->"🥗"}\n        }\n\n    private fun addFoodDialog'
          if old not in s:
              raise SystemExit('expected foodEmoji extra-brace pattern not found')
          main.write_text(s.replace(old, new, 1))

          calc = Path('health-offline-android/app/src/main/java/il/co/offlinehealth/HealthCalculations.kt')
          c = calc.read_text().replace('"טווח משקל תקין"', '"משקל תקין"')
          calc.write_text(c)
          PY

      - name: Inspect goal and dashboard logic
        shell: bash
        run: |
          echo '--- HealthCalculations ---'
          grep -n -E 'calorie|target|goal|guidance|protein|bmi|BMR|tdee|weight' health-offline-android/app/src/main/java/il/co/offlinehealth/HealthCalculations.kt || true
          echo '--- MainActivity relevant snippets ---'
          grep -n -E 'showHome|Dashboard|BMI|bmi|קלור|יעד|מטרה|goal|profile|quick' health-offline-android/app/src/main/java/il/co/offlinehealth/MainActivity.kt | head -n 180 || true

      - name: Build official Israeli nutrition snapshot
        working-directory: health-offline-android
        run: |
          python3 scripts/build_israel_catalog.py
          test -s app/src/main/assets/israel_foods.csv
          rows=$(($(wc -l < app/src/main/assets/israel_foods.csv)-1))
          echo "National nutrition rows: $rows"
          test "$rows" -ge 4000
          head -2 app/src/main/assets/israel_foods.csv

      - name: Run unit tests
        working-directory: health-offline-android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: health-offline-android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and embedded data
        shell: bash
        run: |
          APK=health-offline-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep 'assets/israel_foods.csv'
          unzip -p "$APK" assets/israel_foods.csv | wc -l

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineHealth-1.2.0-debug-apk
          path: health-offline-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
