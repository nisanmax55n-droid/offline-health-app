name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose source chunks
        shell: bash
        run: |
          for f in patch/MainActivity.part*.b64; do echo "$f"; base64 -d "$f" | sha256sum; done
          exit 1
